services:
  apexrun-render:
    build:
      additional_contexts:
        apexrun-caddy: service:apexrun-caddy
        apexrun-crud: service:apexrun-crud
        apexrun-electric: service:apexrun-electric
        apexrun-auth: service:apexrun-auth
        apexrun-served: service:apexrun-served
        plugins_omnishell-runtime-image: >-
          ${MONOREPO_COMPOSE_MODE:-docker-image://bonitao/omnishell:0.25.2@sha256:a807d1ac0bc336c8a6ecfaf2700cb5cad55404468716a4a5791ede8c3d1c1329}${MONOREPO_COMPOSE_MODE:+:plugins_omnishell-runtime-image}
      context: ..
      dockerfile: .bayt/Dockerfile.render
      target: render
      tags:
      - bayt-apexrun-render:${BAYT_IMAGE_TAG:-${COMPOSE_PROJECT_NAME}}
      - bayt-apexrun-render:latest
      args:
        BAYT_DIR: ${MONOREPO_COMPOSE_MODE:+apps/apexrun}
        BUILDKIT_SYNTAX: >-
          docker/dockerfile:1.27@sha256:4edf897a3ffa55b89f906fc8cc78afdb3f1834cc9c7083565e611a8a7d5fe99e
    depends_on:
      apexrun-caddy:
        condition: service_healthy
        restart: true
      apexrun-crud:
        condition: service_healthy
        restart: true
      apexrun-electric:
        condition: service_healthy
        restart: true
      apexrun-auth:
        condition: service_started
    develop:
      watch:
      - action: sync+restart
        path: ../shell/index.html
        target: /render/entry.html
    environment:
      DOOR: http://caddy:8080
      DOOR_TIMEOUT_MS: "41000"
      ENTRY: /render/entry.html
      ORIGIN: ${ORIGIN:-https://localhost:${CADDY_TLS_HOST_PORT:-23221}}
      PORT: "8090"
    healthcheck:
      test:
      - CMD
      - /usr/local/lib/bayt/http200/busybox
      - sh
      - -ec
      - >-
        export CURL_CA_BUNDLE="$${SSL_CERT_FILE:-/usr/local/lib/bayt/http200/ca.pem}";
        status=$$("$$@"); [ "$$status" = 200 ] || { printf 'HTTP status %s, expected
        200\n' "$$status" >&2; exit 1; }
      - http200
      - /usr/local/lib/bayt/http200/curl
      - --disable
      - --silent
      - --show-error
      - --head
      - --request
      - GET
      - --location
      - --max-redirs
      - "9"
      - --max-time
      - "5"
      - --proto
      - =http,https
      - --proto-redir
      - =http,https
      - --output
      - /dev/null
      - --write-out
      - "%{http_code}"
      - http://127.0.0.1:8090/health
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 120s
      start_interval: 200ms
    image: bayt-apexrun-render:${BAYT_IMAGE_TAG:-${COMPOSE_PROJECT_NAME}}
    networks:
      default:
        aliases:
        - render
    restart: on-failure
