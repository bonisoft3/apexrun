            tests/kinetic_engine.test.ts tests/sync.test.ts tests/milestones.test.ts
      assets:
        cmds:
        - do: >-
            deno test --config tests/deno.json --lock tests/deno.lock --frozen
            --unstable-raw-imports --allow-read tests/assets.test.ts tests/art.test.ts
      scenery:
        cmds:
        - do: >-
            deno test --config tests/deno.json --lock tests/deno.lock --frozen
