      renderer:
        cmds:
        - do: >-
            deno test --config tests/deno.json --lock tests/deno.lock --frozen
            --unstable-raw-imports --allow-read --allow-env tests/renderer.test.ts
      run:
        cmds:
        - do: >-
            deno test --config tests/deno.json --lock tests/deno.lock --frozen
            --unstable-raw-imports --allow-read --allow-env tests/run.test.ts
      online_machine:
        cmds:
        - do: >-
            deno test --config tests/deno.json --lock tests/deno.lock --frozen
