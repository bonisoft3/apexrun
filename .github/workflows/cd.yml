name: cd

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  cloudflare:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      # The released sayt at the version the toolchain pins, its mise cached.
      - uses: bonisoft3/sayt/.github/actions/sayt/install@v0.45.1
        with:
          version: v0.45.1
      - run: sayt setup
      - if: "${{ env.CLOUDFLARE_API_TOKEN != '' }}"
        run: sayt release@cloudflare
        working-directory: .
      - if: "${{ env.CLOUDFLARE_API_TOKEN != '' }}"
        run: |
          TARGET=$(cat ./dist/cloudflare/origin.txt 2>/dev/null || cat dist/cloudflare/origin.txt 2>/dev/null || echo "$PRONTO_DEPLOYED_URL")
          if [ -n "$TARGET" ]; then
            sayt verify@cloudflare --target="$TARGET"
          else
            sayt verify@cloudflare
          fi
        working-directory: .