<!doctype html><html><head><meta charset="utf-8"><title>env</title>
<script src="node_modules/babylonjs/babylon.js"></script><script src="engine.js"></script></head>
<body style="margin:0"><canvas id="c" width="64" height="64"></canvas>
<script>
// Prefilters one equirect HDR into a Babylon .env (RGBD PNG mips + spherical harmonics).
window.makeEnv = async (url, size) => {
  const engine = await window.makeEngine(document.getElementById("c"));
  const scene = new BABYLON.Scene(engine);
  const tex = new BABYLON.HDRCubeTexture(url, scene, size, false, true, false, true);
  await new Promise((res, rej) => { tex.onLoadObservable.addOnce(res); setTimeout(() => rej(new Error('hdr load timeout ' + url)), 120000); });
  await new Promise(r => setTimeout(r, 500));
  const buf = await BABYLON.EnvironmentTextureTools.CreateEnvTextureAsync(tex, { imageType: 'image/png' });
  const bytes = new Uint8Array(buf);
  let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  const info = { engine: engine.name, version: BABYLON.Engine.Version, size };
  scene.dispose(); engine.dispose();
  return { b64: btoa(s), info };
};
</script></body></html>
